<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STE Autobody - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="STE.png" alt="STE Autobody logo" width="150" align="top left" hspace="20" vspace="10">
        <nav>
            <ol>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ol>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>
        <p>Fill in the form below and we will get back to you with a free quote.</p>

        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="vehicle">Vehicle Make &amp; Model</label>
            <input type="text" id="vehicle" name="vehicle">

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit" class="btn">Send Message</button>
        </form>

        <h2>Our Details</h2>
        <p>
            Address: 142 Pretoria oarkstreet Road, <br>
            Phone: 0123045409<br>
            Email: @steautobodyy.co.za<br>
            Hours: Mon-Fri 07:30-17:00, Sat 08:00-13:00
        </p>
    </main>
</body>
</html>
